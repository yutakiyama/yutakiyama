name: Metrics

on:
  schedule: # execute daily at 9:00 JST (0:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.SUMMARY_CARD_TOKEN }}
          user: yutakiyama
          template: classic
          filename: github-metrics.svg
          base: header, activity, repositories, metadata
          config_timezone: Asia/Tokyo
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_categories: data, markup, programming, prose
          plugin_languages_limit: 8
          plugin_languages_other: yes
          # habits is disabled: upstream crash on PushEvents whose payload
          # lacks "commits" (zerotema-v2 pushes). Re-enable when fixed.
          # plugin_habits: yes
          # plugin_habits_facts: yes
          # plugin_habits_charts: yes
          # plugin_habits_charts_type: graph
          # plugin_habits_from: 200
          # plugin_habits_days: 14
          # achievements is disabled: upstream uses deprecated Projects (classic) API.
          # plugin_achievements: yes
          # plugin_achievements_display: detailed
          # plugin_achievements_threshold: B
          plugin_topics: yes
          plugin_topics_mode: labels
          plugin_topics_limit: 15
          plugin_lines: yes
          plugin_lines_sections: base, repositories, history
          plugin_lines_delay: 30
          plugin_isocalendar: yes
